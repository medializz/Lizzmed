backend:
  name: git-gateway
  branch: main

local_backend: true
media_folder: "public/assets"
public_folder: "/assets"

display_url: "https://media.lizzdo.com"
site_url: "https://media.lizzdo.com"
logo_url: "/assets/logo.webp"

collections:
  # ==========================================
  # 1. SITE & BRAND SETTINGS (Central Global Hub)
  # ==========================================
  - name: "settings"
    label: "Site & Brand Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "Global Brand, Contact & Social Settings"
        file: "src/data/settings.json"
        fields:
          # Brand Settings
          - { label: "Brand Name", name: "companyName", widget: "string", default: "Lizzdo Media", hint: "Main brand name displayed across the website" }
          - { label: "Brand Tagline", name: "tagline", widget: "string", default: "Branding, Content, Marketing & Websites" }
          - { label: "Division Tagline", name: "division", widget: "string", default: "Creative & Digital Services Division of Lizzdo" }
          - { label: "Company Description", name: "description", widget: "text", hint: "Overview of Lizzdo Media used in footer and search metadata" }
          - { label: "Primary Logo", name: "logo", widget: "image", default: "/assets/logo.webp", hint: "Central logo used in header, footer, and schema" }
          - { label: "Alternative Logo", name: "logoAlt", widget: "image", required: false, hint: "Optional secondary logo variant" }
          - { label: "Favicon", name: "favicon", widget: "image", default: "/assets/logo.webp", hint: "Browser tab icon (WebP, PNG, or ICO format)" }
          - { label: "Default Social Sharing Image", name: "defaultSocialImage", widget: "image", default: "/assets/og-image.jpg", hint: "Fallback image preview for OpenGraph & Twitter cards" }
          
          # Contact & WhatsApp Settings
          - { label: "Business Contact Email", name: "contactEmail", widget: "string", default: "hello@lizzdomedia.com" }
          - { label: "WhatsApp Business Number", name: "whatsappNumber", widget: "string", default: "+1234567890", hint: "International format with country code, e.g. +1234567890. All WhatsApp CTA links auto-generate from this number." }
          - { label: "WhatsApp CTA Label", name: "whatsappCtaText", widget: "string", default: "Chat on WhatsApp", required: false }
          
          # Social Media Channels
          - { label: "Instagram Profile URL", name: "instagramUrl", widget: "string", required: false }
          - { label: "Facebook Page URL", name: "facebookUrl", widget: "string", required: false }
          - { label: "LinkedIn Company URL", name: "linkedinUrl", widget: "string", required: false }
          
          # Website & Parent Company URLs
          - { label: "Website URL", name: "siteUrl", widget: "string", default: "https://media.lizzdo.com" }
          - { label: "Parent Company Name", name: "parentCompany", widget: "string", default: "Lizzdo" }
          - { label: "Parent Company Website", name: "parentCompanyUrl", widget: "string", default: "https://lizzdo.com" }
          
          # Global CTA & Footer
          - { label: "Primary CTA Button Text", name: "primaryCtaText", widget: "string", default: "Start a Project" }
          - { label: "Primary CTA Target Link", name: "primaryCtaUrl", widget: "string", default: "#contact" }
          - { label: "Copyright Notice", name: "copyrightText", widget: "string", default: "© 2026 Lizzdo Media. All rights reserved." }
          - { label: "Parent Company Footer Tag", name: "footerTagline", widget: "string", default: "A Lizzdo company" }
          
          # Default SEO
          - { label: "Default SEO Title", name: "defaultSeoTitle", widget: "string", default: "Lizzdo Media — Creative & Digital Services", hint: "Default page title for search engines" }
          - { label: "Default SEO Description", name: "defaultSeoDescription", widget: "text", default: "Branding, visual content, digital marketing and simple modern websites designed for growing businesses.", hint: "Default summary shown in search results and social previews" }

  # ==========================================
  # 2. HOMEPAGE CONFIGURATION
  # ==========================================
  - name: "homepage"
    label: "Homepage"
    delete: false
    editor:
      preview: false
    files:
      - name: "home"
        label: "Homepage Sections & Content"
        file: "src/data/home.json"
        fields:
          # Hero Section
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Headline Line 1", name: "line1", widget: "string" }
              - { label: "Headline Line 2", name: "line2", widget: "string" }
              - { label: "Subhead Description", name: "subhead", widget: "text" }
              - { label: "Primary CTA Text", name: "primaryCta", widget: "string", default: "Start a Project" }
              - { label: "Secondary CTA Text", name: "secondaryCta", widget: "string", default: "View Our Work" }
              - { label: "Trust Row Pill Text", name: "trustLabel", widget: "string", default: "Creative & Digital Services by Lizzdo" }
              - { label: "Badge Text", name: "badgeText", widget: "string", required: false, default: "Lizzdo Media Studio" }

          # Stats Counter
          - label: "Stats Counter Numbers"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Icon Glyph", name: "icon", widget: "string" }
              - { label: "Target Number", name: "target", widget: "number" }
              - { label: "Suffix", name: "suffix", widget: "string", required: false }
              - { label: "Decimals", name: "decimals", widget: "number", default: 0 }
              - { label: "Label", name: "label", widget: "string" }

          # Introduction Section
          - label: "Introduction Section"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Headline", name: "headline", widget: "string" }
              - { label: "Paragraph 1", name: "paragraph1", widget: "text" }
              - { label: "Paragraph 2", name: "paragraph2", widget: "text" }

          # Services Section Header
          - label: "Services Section Header"
            name: "servicesSection"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }

          # Expertise Section
          - label: "Expertise Showcase"
            name: "expertise"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }
              - label: "Expertise Disciplines"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Discipline Code", name: "code", widget: "string" }
                  - { label: "Discipline Title", name: "title", widget: "string" }
                  - { label: "Icon Glyph", name: "glyph", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
                  - { label: "Service Link", name: "link", widget: "string" }

          # Selected Work Section
          - label: "Featured Work Header"
            name: "selectedWork"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }
              - { label: "CTA Button Text", name: "ctaText", widget: "string", default: "View All Portfolio Works" }

          # Branding Showcase
          - label: "Branding Showcase Banner"
            name: "brandingShowcase"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }
              - label: "Pillar Elements"
                name: "elements"
                widget: "list"
                fields:
                  - { label: "Pillar Title", name: "title", widget: "string" }
                  - { label: "Pillar Description", name: "desc", widget: "string" }

          # Social Media Showcase
          - label: "Social Media Showcase Banner"
            name: "socialShowcase"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }
              - label: "Content Deliverable Pillars"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Pillar Title", name: "title", widget: "string" }
                  - { label: "Pillar Description", name: "desc", widget: "string" }

          # Marketing Showcase
          - label: "Digital Marketing Showcase Banner"
            name: "marketingShowcase"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }
              - { label: "Marketing Highlights", name: "points", widget: "list" }

          # Website Development Showcase
          - label: "Web Development Showcase Banner"
            name: "webShowcase"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }
              - label: "Solution Tiers"
                name: "tiers"
                widget: "list"
                fields:
                  - { label: "Tier Title", name: "pages", widget: "string" }
                  - { label: "Tier Description", name: "desc", widget: "string" }
              - { label: "Technical Highlights", name: "highlights", widget: "list" }

          # Process Section
          - label: "Creative Process"
            name: "process"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Section Description", name: "description", widget: "text" }
              - label: "Process Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Step Number (e.g. 01)", name: "step", widget: "string" }
                  - { label: "Step Name", name: "name", widget: "string" }
                  - { label: "Step Description", name: "desc", widget: "text" }

          # About Preview
          - label: "About Section Preview"
            name: "aboutPreview"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Preview Description", name: "description", widget: "text" }
              - { label: "CTA Button Text", name: "ctaText", widget: "string", default: "More About Lizzdo Media" }

          # Blog Preview
          - label: "Blog / Insights Preview"
            name: "blogPreview"
            widget: "object"
            fields:
              - { label: "Badge Label", name: "badge", widget: "string" }
              - { label: "Section Heading", name: "heading", widget: "string" }
              - { label: "Preview Description", name: "description", widget: "text" }
              - { label: "CTA Button Text", name: "ctaText", widget: "string", default: "View All Articles" }

          # Final Call to Action
          - label: "Final Call to Action Banner"
            name: "finalCta"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subhead", name: "subhead", widget: "text" }
              - { label: "Primary Button Label", name: "primaryBtn", widget: "string", default: "Start a Project" }
              - { label: "Secondary Button Label", name: "secondaryBtn", widget: "string", default: "Chat on WhatsApp" }

          # Homepage SEO
          - label: "Homepage SEO Metadata"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Page SEO Title", name: "title", widget: "string", required: false }
              - { label: "Page SEO Description", name: "description", widget: "text", required: false, hint: "A short description used by search engines and social platforms" }

  # ==========================================
  # 3. SERVICES COLLECTION
  # ==========================================
  - name: "services"
    label: "Services"
    delete: false
    editor:
      preview: false
    files:
      - name: "all_services"
        label: "Services List"
        file: "src/data/services.json"
        fields:
          - label: "All Services"
            name: "services"
            widget: "list"
            fields:
              # Basic Information
              - { label: "Display Order", name: "order", widget: "number", default: 1, hint: "Numerical sort order from 1 upward" }
              - { label: "Number Tag (e.g. 01)", name: "number", widget: "string" }
              - { label: "Service Title", name: "title", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in website URL, e.g. brand-identity" }
              - { label: "Short Title", name: "shortTitle", widget: "string", required: false }
              - { label: "Category", name: "category", widget: "select", options: ["Branding", "Logo Design", "Graphic Design", "Flyer Design", "Social Media", "Marketing", "Advertising", "AI Visuals", "Websites"] }
              
              # Publishing Status
              - { label: "Published (Visible on site and contact form)", name: "published", widget: "boolean", default: true }
              - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: true }
              
              # Service Content & Deliverables
              - { label: "Short Summary", name: "summary", widget: "text" }
              - { label: "Full Description", name: "description", widget: "text" }
              - label: "What We Provide"
                name: "whatWeProvide"
                widget: "list"
                required: false
                fields:
                  - { label: "Feature Title", name: "title", widget: "string" }
                  - { label: "Feature Description", name: "desc", widget: "text" }
              - { label: "Deliverables List", name: "deliverables", widget: "list", required: false }
              - label: "Why It Matters"
                name: "whyItMatters"
                widget: "list"
                required: false
                fields:
                  - { label: "Point Title", name: "title", widget: "string" }
                  - { label: "Point Description", name: "desc", widget: "text" }
              
              # Media & Interaction
              - { label: "CTA Button Text", name: "ctaText", widget: "string", default: "Discuss This Service" }
              - { label: "Hero / Featured Image", name: "featuredImage", widget: "image", default: "/assets/logo.webp", required: false }
              - { label: "Icon Glyph Symbol", name: "iconGlyph", widget: "string", default: "◆" }
              
              # Process Steps
              - label: "Process Steps"
                name: "process"
                widget: "list"
                required: false
                fields:
                  - { label: "Step Number", name: "step", widget: "string" }
                  - { label: "Step Title", name: "title", widget: "string" }
                  - { label: "Step Description", name: "desc", widget: "text" }
                  
              # FAQs
              - label: "Service FAQs"
                name: "faqs"
                widget: "list"
                required: false
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }
                  
              # SEO
              - { label: "Page SEO Title", name: "seoTitle", widget: "string", required: false }
              - { label: "Page SEO Description", name: "seoDescription", widget: "text", required: false, hint: "A short description used by search engines and social platforms" }

  # ==========================================
  # 4. WORK / PORTFOLIO COLLECTION
  # ==========================================
  - name: "portfolio"
    label: "Work / Portfolio"
    delete: false
    editor:
      preview: false
    files:
      - name: "all_projects"
        label: "All Projects List"
        file: "src/data/portfolio.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              # Project Details
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
              - { label: "Project Title", name: "title", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in URL, e.g. aura-brand-identity" }
              - { label: "Client Name", name: "client", widget: "string" }
              - { label: "Year", name: "year", widget: "string", default: "2026" }
              - { label: "Category", name: "category", widget: "select", options: ["Branding", "Logo Design", "Graphic Design", "Flyer Design", "Social Media", "Marketing", "Advertising", "AI Visuals", "Websites"] }
              - { label: "Industry", name: "industry", widget: "string", required: false }
              
              # Publishing Controls
              - { label: "Published (Visible publicly)", name: "published", widget: "boolean", default: true }
              - { label: "Featured Project (Shown on homepage)", name: "featured", widget: "boolean", default: false }
              
              # Overview & Creative Direction
              - { label: "Short Summary", name: "summary", widget: "text" }
              - { label: "Full Overview", name: "description", widget: "text" }
              - { label: "Project Objective", name: "objective", widget: "text", required: false }
              - { label: "Creative Direction", name: "creativeDirection", widget: "text", required: false }
              - { label: "Services Provided", name: "services", widget: "list" }
              
              # Media & Gallery
              - { label: "Featured Image", name: "featuredImage", widget: "image", default: "/assets/logo.webp", required: false }
              - label: "Gallery Deliverables"
                name: "gallery"
                widget: "list"
                required: false
                fields:
                  - { label: "Deliverable Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
                  - { label: "Image File", name: "image", widget: "image", required: false }
              - { label: "Optional Video URL", name: "videoUrl", widget: "string", required: false, hint: "Direct MP4 link or hosted video" }
              - { label: "Live Project Website URL", name: "websiteUrl", widget: "string", required: false }
              - { label: "Project Instagram Post URL", name: "instagramUrl", widget: "string", required: false }
              
              # SEO
              - { label: "Page SEO Title", name: "seoTitle", widget: "string", required: false }
              - { label: "Page SEO Description", name: "seoDescription", widget: "text", required: false, hint: "A short description used by search engines and social platforms" }

  # ==========================================
  # 5. BLOG / INSIGHTS COLLECTION
  # ==========================================
  - name: "blog"
    label: "Blog / Insights"
    delete: false
    editor:
      preview: false
    files:
      - name: "all_articles"
        label: "All Blog Articles"
        file: "src/data/blog.json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            fields:
              # Article Information
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
              - { label: "Article Title", name: "title", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in URL, e.g. anatomy-of-modern-brand" }
              - { label: "Author", name: "author", widget: "string", default: "Lizzdo Media" }
              - { label: "Publish Date", name: "date", widget: "datetime" }
              - { label: "Formatted Date String", name: "formattedDate", widget: "string", default: "August 10, 2026" }
              - { label: "Estimated Read Time", name: "readTime", widget: "string", default: "4 min read" }
              - { label: "Category", name: "category", widget: "select", options: ["Branding", "Marketing", "Social Media", "Design", "Web Development", "Business"] }
              - { label: "Connected Related Service", name: "relatedService", widget: "string", required: false, hint: "Connects article CTA to a service, e.g. Brand Identity" }
              
              # Publishing Status
              - { label: "Published (Visible on site)", name: "published", widget: "boolean", default: true }
              - { label: "Featured Article", name: "featured", widget: "boolean", default: false }
              
              # Content & Markdown Body
              - { label: "Excerpt / Short Intro", name: "excerpt", widget: "text" }
              - { label: "Article Body (Markdown, Headings, Lists & Code Blocks Supported)", name: "body", widget: "markdown" }
              - { label: "Tags", name: "tags", widget: "list", required: false }
              
              # Media
              - { label: "Featured Cover Image", name: "featuredImage", widget: "image", required: false }
              - { label: "Social Sharing Image", name: "socialImage", widget: "image", required: false, hint: "Used for social media card previews" }
              
              # SEO
              - { label: "Page SEO Title", name: "seoTitle", widget: "string", required: false }
              - { label: "Page SEO Description", name: "seoDescription", widget: "text", required: false, hint: "A short description used by search engines and social platforms" }

  # ==========================================
  # 6. ABOUT PAGE CONFIGURATION
  # ==========================================
  - name: "about"
    label: "About Page"
    delete: false
    editor:
      preview: false
    files:
      - name: "about_page"
        label: "About Page Content"
        file: "src/data/about.json"
        fields:
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Subheadline", name: "subheadline", widget: "string" }
          - { label: "Introduction Narrative", name: "introduction", widget: "text" }
          - { label: "Story Paragraphs", name: "paragraphs", widget: "list" }
          - { label: "Mission Statement", name: "mission", widget: "text" }
          - { label: "Creative Approach", name: "approach", widget: "text" }
          - label: "Philosophy Pillars"
            name: "pillars"
            widget: "list"
            fields:
              - { label: "Pillar Number (e.g. 01)", name: "number", widget: "string" }
              - { label: "Pillar Title", name: "title", widget: "string" }
              - { label: "Pillar Description", name: "desc", widget: "text" }
          - { label: "CTA Button Text", name: "ctaText", widget: "string", default: "Start a Conversation" }
          - { label: "Page SEO Title", name: "seoTitle", widget: "string", required: false }
          - { label: "Page SEO Description", name: "seoDescription", widget: "text", required: false, hint: "A short description used by search engines and social platforms" }

  # ==========================================
  # 7. TESTIMONIALS COLLECTION
  # ==========================================
  - name: "testimonials"
    label: "Testimonials"
    delete: false
    editor:
      preview: false
    files:
      - name: "all_testimonials"
        label: "Testimonials List"
        file: "src/data/testimonials.json"
        fields:
          - label: "Client Testimonials (Hidden on website if list is empty or unpublished)"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
              - { label: "Client Name", name: "clientName", widget: "string" }
              - { label: "Company Name", name: "company", widget: "string" }
              - { label: "Role / Position", name: "role", widget: "string" }
              - { label: "Testimonial Quote", name: "testimonial", widget: "text" }
              - { label: "Client Avatar / Photo", name: "image", widget: "image", required: false }
              - { label: "Published (Visible on site)", name: "published", widget: "boolean", default: false }

  # ==========================================
  # 8. FAQ COLLECTION
  # ==========================================
  - name: "faq"
    label: "FAQ"
    delete: false
    editor:
      preview: false
    files:
      - name: "all_faq"
        label: "FAQ Items"
        file: "src/data/faq.json"
        fields:
          - label: "FAQ Items"
            name: "faq"
            widget: "list"
            fields:
              - { label: "Display Order", name: "order", widget: "number", default: 1 }
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
              - { label: "Category", name: "category", widget: "string", default: "General" }
              - { label: "Related Service", name: "relatedService", widget: "string", required: false }
              - { label: "Published (Visible on site)", name: "published", widget: "boolean", default: true }
