<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lizzdo Media</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var cleanPath = path.replace(/^\/+/, '');
        if (cleanPath && cleanPath !== '404.html') {
          window.location.replace('/#' + cleanPath + (search || '') + (hash || ''));
        } else {
          window.location.replace('/' + (search || '') + (hash || ''));
        }
      })();
    </script>
  </head>
  <body style="background-color: #030303; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center;">
    <div>
      <h1 style="font-size: 24px; font-weight: 600; margin-bottom: 12px;">Lizzdo Media</h1>
      <p style="color: #8e8e93; font-size: 15px;">Redirecting...</p>
    </div>
  </body>
</html>
